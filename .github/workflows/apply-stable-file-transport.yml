name: Apply stable file transport patch

on:
  push:
    branches:
      - feature/stable-file-analysis-request
    paths:
      - scripts/apply-stable-file-transport.mjs
      - .github/workflows/apply-stable-file-transport.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stable-file-analysis-request
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply targeted patch
        run: node scripts/apply-stable-file-transport.mjs
      - name: Verify focused transport tests
        run: node --test tests/ui/flow.test.js tests/ui/report-recognition-state.test.js
      - name: Commit patched files
        run: |
          if git diff --quiet -- public/app.js tests/ui/flow.test.js; then
            echo "Patch made no changes"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js tests/ui/flow.test.js
          git commit -m "fix: use stable file analysis request transport"
          git push origin HEAD:feature/stable-file-analysis-request
