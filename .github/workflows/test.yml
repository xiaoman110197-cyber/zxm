name: Test

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Production OCR runtime smoke
        if: github.ref == 'refs/heads/fix/ocr-production-smoke-core-assets'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const source = readFileSync('tests/documents/real-ocr.test.js', 'utf8');
          const match = source.match(/const PNG_BASE64 = '([^']+)'/s);
          if (!match) throw new Error('OCR fixture not found');

          const response = await fetch('https://zhenduan-v03-preview.vercel.app/api/analyze-file?stream=1', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ file:{ name:'production-smoke.png', contentBase64:match[1] } }),
            signal: AbortSignal.timeout(40000)
          });
          const body = await response.text();
          console.log(`production OCR HTTP ${response.status}`);

          const blocks = body.split('\n\n').filter(Boolean);
          for (const block of blocks.filter((item) => item.startsWith('event: progress'))) {
            const line = block.split('\n').find((item) => item.startsWith('data: '));
            const payload = line ? JSON.parse(line.slice(6)) : {};
            console.log(`progress ${payload.phase || '-'} ${payload.stage || '-'} ${payload.percent ?? '-'}%`);
          }

          const resultBlock = blocks.find((block) => block.startsWith('event: result'));
          const errorBlock = blocks.find((block) => block.startsWith('event: error'));
          if (!resultBlock) {
            if (errorBlock) {
              const line = errorBlock.split('\n').find((item) => item.startsWith('data: '));
              const payload = line ? JSON.parse(line.slice(6)) : {};
              console.log(`production OCR safe error: ${payload.error || 'unknown'}`);
            }
            throw new Error('production OCR did not reach result event');
          }

          const line = resultBlock.split('\n').find((item) => item.startsWith('data: '));
          const payload = JSON.parse(line.slice(6));
          const text = payload.document?.text || '';
          console.log(`production OCR confidence ${payload.document?.confidence ?? 'unknown'}`);
          if (!/营业\s*额/.test(text) || !/88/.test(text)) {
            throw new Error('production OCR result did not recognize the synthetic Chinese+numeric fixture');
          }
          console.log('production OCR runtime smoke: PASS');
          NODE
