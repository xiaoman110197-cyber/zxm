name: Apply Report UI Patch
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/deepseek-ocr-pipeline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deepseek-ocr-pipeline
      - name: Apply verified patch
        run: python scripts/apply-report-ui.py
      - name: Remove temporary patching helpers
        run: rm -f scripts/apply-report-ui.py .github/workflows/export-source.yml .github/workflows/apply-report-ui.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js scripts/apply-report-ui.py .github/workflows/export-source.yml .github/workflows/apply-report-ui.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: make report recognition state explicit"
          git push origin HEAD:feature/deepseek-ocr-pipeline
