<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>老板经营诊断 AI</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f7f7f5}*{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:auto;padding:24px 18px 48px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.badge{font-size:12px;background:#eaf5e7;color:#386b35;padding:7px 10px;border-radius:999px}.card{background:#fff;border:1px solid #e8e8e3;border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.04)}h1{font-size:28px;margin:0 0 10px}.sub{color:#666;line-height:1.6;margin-bottom:24px}label{font-weight:650;display:block;margin:18px 0 8px}input,textarea,select{width:100%;border:1px solid #ddd;border-radius:12px;padding:13px 14px;font-size:16px;background:#fff}textarea{min-height:96px;resize:vertical}button{width:100%;margin-top:22px;border:0;border-radius:12px;background:#111;color:#fff;padding:15px;font-size:16px;font-weight:700}.result{display:none;margin-top:20px;padding:18px;border-radius:14px;background:#f4f4f1;line-height:1.7}.small{font-size:12px;color:#999;margin-top:18px}</style>
</head>
<body><main class="wrap"><div class="top"><strong>AI · V0.2</strong><span class="badge">经营诊断</span></div><section class="card"><h1>老板经营诊断 AI</h1><p class="sub">回答几个关键问题，先把门店当前最需要解决的问题找出来，再给出下一步行动建议。</p><form id="f"><label>你的店是什么类型？</label><input id="type" placeholder="例如：咖啡店 / 餐厅 / 甜品店" required><label>目前最困扰你的问题？</label><select id="problem"><option>客流少</option><option>曝光少</option><option>复购低</option><option>团购转化低</option><option>不知道怎么做推广</option></select><label>你现在主要在哪个平台推广？</label><input id="platform" placeholder="例如：小红书 / 抖音 / 大众点评"><label>补充说明</label><textarea id="note" placeholder="例如：门店位置、客单价、最近做过什么活动……"></textarea><button type="submit">生成初步诊断</button></form><div id="r" class="result"></div><p class="small">V0.2 基线版 · 当前为规则诊断，后续可接入 AI API、达人数据与商家数据接口。</p></section></main><script>document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const t=type.value||'门店',p=problem.value,pl=platform.value||'当前平台';const map={'客流少':'先检查门店曝光入口、到店理由和附近客群触达。建议先做一轮本地内容测试，并记录到店来源。','曝光少':'先建立稳定内容供给，再测试达人探店与本地关键词覆盖。不要先追求达人数量，先看有效曝光成本。','复购低':'先检查产品记忆点、会员承接和二次触达。把新客到复购的路径单独统计。','团购转化低':'重点检查团购套餐吸引力、页面素材、价格锚点和核销体验，并按曝光→点击→购买→核销拆数据。','不知道怎么做推广':'先确定目标客群和一个主平台，用小预算做两周测试，再根据数据决定是否扩大达人投放。'};r.style.display='block';r.innerHTML='<strong>初步诊断</strong><br>'+t+'目前的核心问题是「'+p+'」。在'+pl+'上，'+map[p]+'<br><br><strong>下一步：</strong>先记录7天基础数据：曝光、进店/咨询、成交或核销、客单价，再决定推广方案。';r.scrollIntoView({behavior:'smooth'});});</script></body></html>
